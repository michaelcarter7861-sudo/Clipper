name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check clipper tests

      - name: Unit and integration tests
        run: pytest -q

  workflow-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the YAML parses and the CLI answers
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, yaml
          for path in glob.glob(".github/workflows/*.yml"):
              with open(path, "r", encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              assert isinstance(data, dict) and "jobs" in data, path
              print("ok", path, "->", len(data["jobs"]), "job(s)")
          PY
          python -m clipper --version
