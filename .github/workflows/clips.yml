name: Clipper · YouTube → viral clips

# Paste a YouTube link, get back vertical clips with burned-in captions.
# Runs are manual on purpose: clipping burns Actions minutes and YouTube
# downloads are rate-limited.

run-name: Clipper · ${{ inputs.clips }} clip(s) from ${{ github.event.inputs.urls }}

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "YouTube link(s) — one per line or comma separated"
        required: true
        type: string
      clips:
        description: "How many clips per video"
        default: "3"
        type: string
      min_duration:
        description: "Minimum clip length (seconds)"
        default: "18"
        type: string
      max_duration:
        description: "Maximum clip length (seconds)"
        default: "60"
        type: string
      caption_style:
        description: "Caption style"
        type: choice
        default: karaoke
        options: [karaoke, plain, none]
      editing:
        description: "Editing level"
        type: choice
        default: full
        options: [full, cuts, "off"]
      watermark:
        description: "Optional watermark/handle, e.g. @yourchannel (blank = none)"
        default: ""
        type: string
      max_height:
        description: "Highest source resolution to download (1080, 720, 480 …)"
        default: "1080"
        type: string
      fit:
        description: "How to fill a 9:16 frame (facecam = cam on top, gameplay below)"
        type: choice
        default: crop
        options: [crop, blur, pad, facecam, auto]
      language:
        description: "Preferred language (auto, en, hi, ur, …)"
        default: auto
        type: string
      whisper_model:
        description: "Whisper model when a video has no subtitles"
        type: choice
        default: base
        options: [tiny, base, small, medium]
      llm_backend:
        description: "Who picks the viral moments"
        type: choice
        default: auto
        options: [auto, claude-code, api, heuristic]
      publish_release:
        description: "Also publish the clips as a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clipper-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CLIP_WORK_DIR: ${{ github.workspace }}/.clipper-work
  CAPTION_FONT: DejaVu Sans

jobs:
  clip:
    name: Cut clips
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-facecam.txt
            requirements-whisper.txt

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
          ffmpeg -version | head -n 1

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.whisper_model }}-${{ runner.os }}

      - name: Install the facecam detector (only for fit=facecam/auto)
        if: ${{ inputs.fit == 'facecam' || inputs.fit == 'auto' }}
        run: pip install -r requirements-facecam.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Whisper is only a fallback for videos without subtitles — a failed
          # install must not block the whole run.
          pip install -r requirements-whisper.txt \
            || echo "::warning::faster-whisper install failed; only videos with subtitles will work"

      - name: Install Claude Code
        if: ${{ inputs.llm_backend == 'auto' || inputs.llm_backend == 'claude-code' }}
        run: |
          npm install -g @anthropic-ai/claude-code \
            || echo "::warning::Claude Code install failed; using the direct LLM API path"
          claude --version || true

      - name: Install a JS runtime for yt-dlp (YouTube challenges)
        run: |
          # yt-dlp only ships Deno support by default and needs a JS runtime to solve
          # YouTube's signature challenges; Node is already on the runner as a fallback.
          npm install -g deno || echo "::warning::deno install failed; yt-dlp will use node"
          deno --version || true
          node --version || true

      - name: Prepare YouTube cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then
            echo "No YT_COOKIES secret set — trying without cookies."
            exit 0
          fi
          mkdir -p "$CLIP_WORK_DIR"
          # Accepts the raw cookies.txt text or its base64 form, validates it, and
          # asks YouTube whether that session actually works.
          python -m clipper.cookies --from-secret \
            --out "$CLIP_WORK_DIR/cookies.txt" --test || true
          if [ -s "$CLIP_WORK_DIR/cookies.txt" ]; then
            echo "CLIP_COOKIES=$CLIP_WORK_DIR/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Check YouTube access from this runner (informational)
        continue-on-error: true
        run: |
          if python -m clipper --check-youtube; then
            echo "### YouTube access: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### YouTube access: BLOCKED from this runner"
              echo ""
              echo "A public test video gets no stream either, so YouTube is blocking this"
              echo "machine's IP (datacenter address) — not your link."
              echo ""
              echo "- Set the \`YT_PROXY\` secret to a residential proxy, **or**"
              echo "- pass a direct video link (e.g. Dropbox \`?dl=1\`), **or** run it where the IP is residential."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::YouTube is not serving this runner — YouTube links will fail. Set YT_PROXY or use a direct file link."
          fi

      - name: Cut clips
        env:
          CLIP_URLS: ${{ inputs.urls }}
          CLIP_COUNT: ${{ inputs.clips }}
          CLIP_MIN_DURATION: ${{ inputs.min_duration }}
          CLIP_MAX_DURATION: ${{ inputs.max_duration }}
          CAPTION_STYLE: ${{ inputs.caption_style }}
          CLIP_EDITING: ${{ inputs.editing }}
          CLIP_WATERMARK: ${{ inputs.watermark }}
          CLIP_MAX_VIDEO_HEIGHT: ${{ inputs.max_height }}
          # Optional: route yt-dlp through a proxy when this runner's IP is throttled
          YT_PROXY: ${{ secrets.YT_PROXY }}
          CLIP_PROXY: ${{ secrets.YT_PROXY }}
          # Optional: extra yt-dlp flags, e.g. --cookies-from-browser chrome
          YTDLP_EXTRA_ARGS: ${{ vars.YTDLP_EXTRA_ARGS }}
          CLIP_FIT: ${{ inputs.fit }}
          CLIP_LANGUAGE: ${{ inputs.language }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          LLM_BACKEND: ${{ inputs.llm_backend }}
          # Free LLM endpoints — set whichever you have (all have free tiers).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # …or a self-hosted FreeLLMAPI router / any OpenAI-compatible endpoint
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          # …or a ready Anthropic-compatible endpoint for Claude Code
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || secrets.CLAUDE_MODEL }}
        run: |
          if [ -z "${CLIP_URLS//[[:space:]]/}" ]; then
            echo "::error::Add at least one YouTube link in the 'urls' input."
            exit 1
          fi
          python -m clipper --doctor || true
          python -m clipper 2>&1 | tee /tmp/clipper.log

      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: out/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: Run summary
        if: always()
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          echo "## Clipper run" >> "$summary"
          clips=$(find out -name 'clip-*.mp4' 2>/dev/null | wc -l | tr -d ' ')
          echo "" >> "$summary"
          echo "- **Clips produced:** ${clips}" >> "$summary"
          python - <<'PY' >> "$summary"
          import glob, json, pathlib

          rows = []
          for path in sorted(glob.glob("out/*/info.json")):
              try:
                  data = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except Exception:
                  continue
              formats = data.get("formats") or []
              rows.append(
                  (
                      data.get("title") or path,
                      data.get("chosen_format") or "-",
                      formats[0]["resolution"] if formats else "-",
                      len(formats),
                      data.get("live_status") or "-",
                  )
              )
          if rows:
              print("")
              print("| video | picked | best listed | formats seen | live |")
              print("| --- | --- | --- | --- | --- |")
              for title, chosen, best, count, live in rows:
                  title = str(title).replace("|", "/")[:60]
                  print(f"| {title} | {chosen} | {best} | {count} | {live} |")
          PY
          if [ -f /tmp/clipper.log ]; then
            errors=$(grep -E "ERROR|Traceback|storyboard" /tmp/clipper.log | tail -8 || true)
            if [ -n "$errors" ]; then
              {
                echo ""
                echo "<details><summary>Why it failed</summary>"
                echo ""
                echo '```'
                echo "$errors"
                echo '```'
                echo "</details>"
              } >> "$summary"
            fi
          fi
          if [ -f out/formats.txt ]; then
            echo "" >> "$summary"
            echo "Formats YouTube listed (and every attempt): see \`out/formats.txt\` in the artifact." >> "$summary"
          fi

      - name: Publish clips as a GitHub Release
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find out -name '*.mp4' -size +0c | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No clips to publish."
            exit 0
          fi
          notes=out/report.md
          [ -f "$notes" ] || { echo "Clipper run $(date -u)" > /tmp/notes.md; notes=/tmp/notes.md; }
          tag="clips-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" "${files[@]}" \
            --title "Clips · $(date -u +%Y-%m-%d)" \
            --notes-file "$notes" \
            --latest=false
          echo "Published $tag with ${#files[@]} clip(s)."
