name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check clipper tests

      - name: Unit and integration tests
        run: |
          set +e
          pytest -q --tb=short > /tmp/pytest.log 2>&1
          status=$?
          tail -80 /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import pathlib
          lines = pathlib.Path("/tmp/pytest.log").read_text(errors="replace").splitlines()
          picks = [ln for ln in lines if ln.startswith(("FAILED", "ERROR", "!!!"))][:8]
          tail = lines[-25:]
          for chunk in (picks, tail):
              msg = "%0A".join(
                  ln.replace("%", "%25").replace("\r", "") for ln in chunk if ln.strip()
              )
              if msg:
                  print(f"::error::{msg}")
          PY
          fi
          exit $status

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: /tmp/pytest.log
          if-no-files-found: ignore

  workflow-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the YAML parses and the CLI answers
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, yaml
          for path in glob.glob(".github/workflows/*.yml"):
              with open(path, "r", encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              assert isinstance(data, dict) and "jobs" in data, path
              print("ok", path, "->", len(data["jobs"]), "job(s)")
          PY
          python -m clipper --version
