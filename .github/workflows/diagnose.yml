name: Clipper · diagnose a link

# Answers one question: can a GitHub runner download this link at all?
# It prints our own checks, then asks yt-dlp directly with every player client, and
# publishes the result to diagnostics/last-run.txt so it can be read without the log.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube (or direct video) link to diagnose"
        required: true
        default: "https://youtu.be/DENbjnmSems"
        type: string
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  diagnose:
    # push runs happen only when the commit message asks for one, so normal pushes stay quiet
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[diagnose]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Install a JS runtime for yt-dlp
        run: |
          npm install -g deno || echo "::warning::deno install failed"
          deno --version || true
          node --version || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect diagnostics
        env:
          URL: ${{ github.event.inputs.url || 'https://youtu.be/DENbjnmSems' }}
        run: |
          mkdir -p diagnostics
          report=diagnostics/last-run.txt
          {
            echo "url: $URL"
            echo "date: $(date -u +%FT%TZ)"
            echo "runner ip: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
            echo
            echo "== versions =="
            python --version
            python -c "import yt_dlp; print('yt-dlp', yt_dlp.version.__version__)" || true
            (deno --version | head -1) || echo "deno: missing"
            node --version || echo "node: missing"
            echo
            echo "== clipper --check-youtube =="
            python -m clipper --check-youtube || true
            echo
            echo "== clipper --list-formats =="
            python -m clipper --list-formats --url "$URL" || true
            echo
            for client in default android ios tv web_safari mweb tv_embedded; do
              echo "== yt-dlp -F (player_client=$client) =="
              timeout 120 yt-dlp -F --no-warnings \
                --extractor-args "youtube:player_client=$client" "$URL" 2>&1 | head -n 25 || true
              echo
            done
            echo "== yt-dlp -f b (real download, 90 s cap) =="
            timeout 90 yt-dlp -f b --no-warnings -o "/tmp/dl.%(ext)s" "$URL" 2>&1 | tail -n 6 || true
            ls -l /tmp/dl.* 2>/dev/null || echo "no file downloaded"
            echo
          } >> "$report" 2>&1
          cat "$report"

      - name: Publish the report on this branch
        run: |
          git config user.name "clipper-diagnostics"
          git config user.email "clipper-diagnostics@users.noreply.github.com"
          git add diagnostics/last-run.txt
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -m "diagnostics: $(date -u +%FT%TZ) [skip ci]"
          git push
