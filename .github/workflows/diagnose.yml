name: Clipper · diagnose a link

# Answers one question with measurements instead of guesses:
#   does a GitHub runner get a downloadable YouTube stream for this link,
#   with cookies and without, and does the runner OS matter?
#
# Run it from the Actions tab ("Run workflow", paste a link), then read
# diagnostics/<os>.txt in the artifact — or the job summary on the run page.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube (or direct video) link to diagnose"
        required: true
        default: "https://www.youtube.com/watch?v=aqz-KE-bpKQ"
        type: string
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  probe:
    # push runs happen only when the commit message asks for one
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[diagnose]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        shell: bash
        run: python -m pip install --quiet --upgrade yt-dlp

      - name: Ask YouTube what it offers (cookies and no cookies)
        shell: bash
        env:
          URL: ${{ github.event.inputs.url || 'https://www.youtube.com/watch?v=aqz-KE-bpKQ' }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
        run: |
          mkdir -p diagnostics
          report="diagnostics/${RUNNER_OS}.txt"

          if [ -n "$YT_COOKIES" ]; then
            python - <<'PY'
          import base64, os, pathlib
          raw = os.environ["YT_COOKIES"].strip()
          if not raw.startswith("# Netscape"):
              try:
                  raw = base64.b64decode("".join(raw.split())).decode("utf-8")
              except Exception:
                  pass
          pathlib.Path("cookies.txt").write_text(raw, encoding="utf-8")
          print("cookies.txt bytes:", len(raw))
          PY
          fi

          proxy_arg=""
          [ -n "$YT_PROXY" ] && proxy_arg="--proxy $YT_PROXY"

          {
            echo "os: ${RUNNER_OS}"
            echo "date: $(date -u +%FT%TZ)"
            echo "ip: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
            echo "proxy configured: $([ -n "$YT_PROXY" ] && echo yes || echo no)"
            python -c "import yt_dlp; print('yt-dlp', yt_dlp.version.__version__)" || true
            echo
            for mode in cookies nocookie; do
              args=""
              if [ "$mode" = "cookies" ] && [ -f cookies.txt ]; then
                args="--cookies cookies.txt"
              elif [ "$mode" = "cookies" ]; then
                continue
              fi
              for client in default tv android web_safari; do
                echo "== ${mode} · client=${client} =="
                yt-dlp -F --no-warnings $args $proxy_arg \
                  --extractor-args "youtube:player_client=${client}" "$URL" 2>&1 | head -n 22 || true
                echo
              done
            done
            echo "== download attempt (cookies, best, 20 MB cap) =="
            if [ -f cookies.txt ]; then
              yt-dlp -f b --no-warnings --cookies cookies.txt $proxy_arg \
                -o "dl.%(ext)s" --max-filesize 20M "$URL" 2>&1 | tail -n 8 || true
              ls -l dl.* 2>/dev/null || echo "no file downloaded"
            fi
          } >> "$report" 2>&1

          cat "$report"

          {
            echo "### Diagnose · ${RUNNER_OS}"
            echo ""
            echo '```'
            grep -E "^os:|^ip:|^== |ERROR:|sb0 " "$report" | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe the public instances (the no-proxy fallback)
        if: runner.os == 'Linux'
        shell: bash
        env:
          URL: ${{ github.event.inputs.url || 'https://www.youtube.com/watch?v=aqz-KE-bpKQ' }}
        run: |
          report="diagnostics/${RUNNER_OS}.txt"
          {
            echo
            echo "== public instances =="
            python scripts/probe_upstream.py "$URL" || true
            echo
            echo "== public instances (curl) =="
            bash scripts/probe_curl.sh "$URL" || true
          } >> "$report" 2>&1
          sed -n '/== public instances ==/,$p' "$report"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: diagnostics/
          if-no-files-found: ignore

      # Only my own [diagnose] pushes publish the file back; a user-triggered run
      # leaves the repository untouched (the artifact and summary are enough).
      - name: Publish the report on this branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "clipper-diagnostics"
          git config user.email "clipper-diagnostics@users.noreply.github.com"
          git add -f diagnostics
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -m "diagnostics (${RUNNER_OS}) [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "published"
              break
            fi
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done

  pot:
    # The one thing that can still work from a datacenter IP without a proxy: mint the
    # proof-of-origin token YouTube expects, with the community provider that runs the
    # BotGuard challenge in a real JS runtime. No bypass, no cookies, no proxy.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[diagnose]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp with the PO token provider
        shell: bash
        run: |
          python -m pip install --quiet --upgrade yt-dlp
          python -m pip install --quiet --upgrade bgutil-ytdlp-pot-provider || echo "::warning::plugin install failed"
          docker run -d --name bgutil -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest \
            || echo "::warning::docker provider failed"
          for i in $(seq 1 20); do
            if curl -sf -m 2 http://127.0.0.1:4416/ping >/dev/null; then echo "provider: up"; break; fi
            sleep 3
          done
          curl -s -m 5 http://127.0.0.1:4416/ping || echo "provider: no ping"

      - name: Ask YouTube again, now with a PO token
        shell: bash
        env:
          URL: ${{ github.event.inputs.url || 'https://youtu.be/DENbjnmSems' }}
        run: |
          mkdir -p diagnostics
          report="diagnostics/pot-Linux.txt"
          {
            echo "url: $URL"
            echo "date: $(date -u +%FT%TZ)"
            echo "ip: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
            python -c "import yt_dlp, importlib.metadata as m; print('yt-dlp', yt_dlp.version.__version__); print('pot plugin', m.version('bgutil-ytdlp-pot-provider'))" 2>&1 || true
            echo
            for client in web tv android_vr mweb; do
              echo "== client=${client} =="
              yt-dlp -F --no-warnings --extractor-args "youtube:player_client=${client}" "$URL" 2>&1 | head -n 18 || true
              echo
            done
            echo "== download 20 MB with the provider =="
            yt-dlp -f "bv*[height<=720]+ba/b[height<=720]/b" --no-warnings --max-filesize 20M \
              -o "dl.%(ext)s" "$URL" 2>&1 | tail -n 12 || true
            ls -l dl.* 2>/dev/null || echo "no file downloaded"
          } >> "$report" 2>&1
          cat "$report"

      - name: Publish the report on this branch
        if: github.event_name == 'push' || startsWith(github.ref_name, 'arena/')
        shell: bash
        run: |
          git config user.name "clipper-diagnostics"
          git config user.email "clipper-diagnostics@users.noreply.github.com"
          git add -f diagnostics
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "diagnostics: po-token (Linux) [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then echo published; break; fi
            sleep 5
          done


  browser:
    # Same question, different asker: what does a real browser get for this link?
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[diagnose]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install obscura
        run: |
          set -euo pipefail
          url="https://github.com/h4ckf0r0day/obscura/releases/latest/download/obscura-x86_64-linux-no-render-stealth.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$tmp/obscura.tgz" "$url"
          tar xzf "$tmp/obscura.tgz" -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          find "$tmp" -maxdepth 3 -type f -name obscura -exec cp {} "$HOME/.local/bin/obscura" \;
          chmod +x "$HOME/.local/bin/obscura"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/obscura" --version

      - name: Install yt-dlp
        run: python -m pip install --quiet --upgrade yt-dlp

      - name: Ask the browser what YouTube serves
        env:
          URL: ${{ github.event.inputs.url || 'https://www.youtube.com/watch?v=aqz-KE-bpKQ' }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
        run: |
          set -uo pipefail
          report="browser-report.txt"
          {
            echo "os: ${RUNNER_OS}"
            echo "date: $(date -u +%FT%TZ)"
            echo "ip: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
            echo "proxy configured: $([ -n "${YT_PROXY:-}" ] && echo yes || echo no)"
            obscura --version || true
            python -m clipper --check-youtube --browser obscura 2>&1 | tail -n 5 || true
            echo
            echo "== raw obscura probes =="
            set +e
            obscura fetch "$URL" --eval "document.title" --timeout 60 2>&1 | head -n 3
            echo "exit: $?"
            obscura fetch "$URL" --dump cookies --timeout 60 2>&1 | head -c 300
            echo
            obscura fetch --help 2>&1 | head -n 25
            set -e
            echo
            echo "== browser player response =="
            python - <<'PY'
          import json, os
          from pathlib import Path
          from clipper.browser import fetch_page, pick_streams
          from clipper.config import Settings

          settings = Settings(browser="obscura", proxy=os.environ.get("YT_PROXY", ""))
          page = fetch_page(os.environ["URL"], settings, storage_dir=Path("browser-profile"))
          print("ok:", page.ok, "| elapsed:", round(page.elapsed, 1), "s")
          print(page.describe())
          print("cookies:", len(page.cookies))
          video, audio = pick_streams(page.player_response, settings.max_video_height)
          print("video stream:", (video or {}).get("itag"), (video or {}).get("height"))
          print("audio stream:", (audio or {}).get("itag"))
          Path("browser-page.json").write_text(json.dumps(page.to_dict(), indent=2))
          PY
          } >> "$report" 2>&1

          cat "$report"
          {
            echo "### Browser · ${RUNNER_OS}"
            echo ""
            echo '```'
            head -n 40 "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the browser report
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            browser-report.txt
            browser-page.json
          if-no-files-found: ignore

      # Only my own [diagnose] pushes publish the report back; a user-triggered
      # run leaves the repository untouched.
      - name: Publish the browser report
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p diagnostics
          cp browser-report.txt "diagnostics/browser-${RUNNER_OS}.txt"
          git config user.name "clipper-diagnostics"
          git config user.email "clipper-diagnostics@users.noreply.github.com"
          git add -f diagnostics
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -m "diagnostics: browser (${RUNNER_OS}) [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "published"
              break
            fi
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
